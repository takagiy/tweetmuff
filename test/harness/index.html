<!doctype html>
<meta charset="utf-8" />
<title>tweetmuff harness</title>
<script>
  // Simulate a signed-in user (read by main.js through cookieStore) and the bridge having written state.
  document.cookie = "twid=u%3D4242; path=/; max-age=60";
  localStorage.setItem(
    "tweetmuff:state",
    JSON.stringify({
      enabled: true,
      imported: [],
      local: [{ keyword: "spoiler" }, { keyword: "ネタバレ" }],
    }),
  );
</script>
<script src="core.js"></script>
<script src="main.js"></script>
<body>
  <!-- Markup shaped like X's, containing a muted word: tweetmuff must leave the DOM alone. -->
  <div id="tl">
    <div data-testid="cellInnerDiv" id="c1">
      <article data-testid="tweet">
        <div data-testid="tweetText">a spoiler here</div>
      </article>
    </div>
  </div>
  <pre id="out"></pre>
  <script>
    // Expected: xhrText / xhrJson / fetch == expected.afterFilter, unlisted == expected.total, imported == 3,
    // cleanFetchUntouched == true, ownPostKept == true, domUntouched == true,
    // problems == [{ feature: 'import', step: 'format', kind: 'UnknownFormat' }] for the unrecognizable mute list
    window.results = {};
    document.addEventListener("tweetmuff:imported", (e) => {
      results.imported = JSON.parse(e.detail).rules.length;
    });
    document.addEventListener("tweetmuff:problem", (e) => {
      (results.problems ??= []).push(JSON.parse(e.detail));
    });
    fetch("expected.json")
      .then((r) => r.json())
      .then((e) => {
        results.expected = e;
      });
    const count = (d) =>
      d.data.home.home_timeline_urt.instructions[0].entries.length;
    const TL = "/i/api/graphql/q/HomeTimeline";
    const x = new XMLHttpRequest();
    x.open("GET", TL);
    x.onload = () => {
      results.xhrText = count(JSON.parse(x.responseText));
      results.xhrStable = x.responseText === x.responseText;
      const y = new XMLHttpRequest();
      y.responseType = "json";
      y.open("GET", TL);
      y.onload = () => {
        results.xhrJson = count(y.response);
      };
      y.send();
    };
    x.send();
    fetch(TL)
      .then((r) => r.json())
      .then((d) => {
        results.fetch = count(d);
      });
    // A response tweetmuff leaves alone is X's original Response object (type "basic"), not a rebuilt one.
    fetch("/i/api/graphql/clean/HomeTimeline").then((r) => {
      results.cleanFetchUntouched = r.type === "basic" && !r.bodyUsed;
    });
    // Not on the allowlist: must come back exactly as served.
    const ux = new XMLHttpRequest();
    ux.open("GET", "/i/api/graphql/q/SomethingNew");
    ux.onload = () => {
      results.unlisted = count(JSON.parse(ux.responseText));
    };
    ux.send();
    const m = new XMLHttpRequest();
    m.open("GET", "/i/api/1.1/mutes/keywords/list.json");
    m.send();
    const bad = new XMLHttpRequest();
    bad.open("GET", "/i/api/1.1/mutes/keywords/list.json?variant=bad");
    bad.send();
    // Own posts: give the async cookieStore read a moment, then the user's own muted post must stay.
    setTimeout(() => {
      const sx = new XMLHttpRequest();
      sx.open("GET", "/i/api/graphql/self/HomeTimeline");
      sx.onload = () => {
        const t = sx.responseText;
        results.ownPostKept =
          t.includes("my own spoiler") && !t.includes("their spoiler");
      };
      sx.send();
    }, 200);
    const headChildren = document.head.children.length;
    setTimeout(() => {
      const c2 = document.createElement("div");
      c2.dataset.testid = "cellInnerDiv";
      c2.id = "c2";
      c2.innerHTML =
        '<article data-testid="tweet"><div data-testid="tweetText">最終回のネタバレ</div></article>';
      document.getElementById("tl").append(c2);
    }, 50);
    setTimeout(() => {
      const cells = ["c1", "c2"].map((id) => document.getElementById(id));
      // No hidden cells, no added attributes, no injected <style> or other head elements.
      results.domUntouched =
        cells.every(
          (c) =>
            getComputedStyle(c).display !== "none" && c.attributes.length === 2,
        ) &&
        !document.querySelector("style") &&
        document.head.children.length === headChildren;
      document.getElementById("out").textContent = JSON.stringify(
        results,
        null,
        1,
      );
    }, 600);
  </script>
</body>
